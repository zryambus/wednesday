[package]
name = "wednesday"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
thiserror = "2.0.12"
config = "0.15.11"
chrono = "0.4.41"
clokwerk = "0.4.0"
teloxide-core = { version = "0.11.2", default-features = false }
teloxide = { version = "0.15.0", default-features = false, features = ["ctrlc_handler", "rustls", "macros", "cache-me"] }
tokio = { version =  "1.45.0", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.17"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_cbor = "0.11.2"
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3.31"
bb8 = "0.9.0"
bb8-redis = "0.23.0"
sentry = { version = "0.38.1", default-features = false, features = ["anyhow", "reqwest", "rustls", "backtrace", "contexts", "panic", "log", "tracing"] }
tracing = "0.1.41"
tracing-futures = "=0.2.5"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "tracing-log", "registry", "std"] }
tracing-log = "=0.2.0"
async-trait = "0.1.88"
alea = "=0.2.2"
regex = "1.11.1"
sqlx = { version = "0.8.5", features = [ "runtime-tokio", "tls-rustls", "migrate", "postgres", "macros" ] }
build-time = "0.1.3"
serde-this-or-that = { version = "0.5.0", features = ["derive"] }

# [profile.release]
# opt-level = 3
# strip = false
# debug = true
# codegen-units = 1
# lto = true
