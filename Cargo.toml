[package]
name = "wednesday"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
thiserror = "2.0.19"
config = "0.15.25"
chrono = "0.4.45"
clokwerk = "0.4.0"
teloxide-core = { version = "0.13.0", default-features = false }
teloxide = { version = "0.17.0", default-features = false, features = ["ctrlc_handler", "rustls", "macros", "cache-me"] }
tokio = { version =  "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.19"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_cbor = "0.11.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
futures = "0.3.33"
bb8 = "0.9.1"
bb8-redis = "0.26.0"
sentry = { version = "0.48.5", default-features = false, features = ["anyhow", "reqwest", "rustls", "backtrace", "contexts", "panic", "log", "tracing"] }
tracing = "0.1.44"
tracing-futures = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "tracing-log", "registry", "std"] }
tracing-log = "0.2.0"
async-trait = "0.1.91"
alea = "0.2.2"
regex = "1.13.1"
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-rustls", "migrate", "postgres", "macros" ] }
build-time = "0.1.3"
serde-this-or-that = { version = "0.5.0", features = ["derive"] }

# [profile.release]
# opt-level = 3
# strip = false
# debug = true
# codegen-units = 1
# lto = true
